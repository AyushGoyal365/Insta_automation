name: Reel Pipeline T2

on:
  schedule:
    # Target run times (IST, UTC+5:30): 10PM 11PM 12AM 2AM 5AM 6AM 7AM 8AM 12PM 4PM 6PM
    # Each maps to :30 past the hour in UTC. Cron fires 15min early (:15) and
    # the jitter step below sleeps 0-30min, so the actual run lands randomly
    # within +/-15min of the target instead of on the dot.
    - cron: "15 0,1,2,6,10,12,16,17,18,20,23 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Random jitter (skip on manual trigger)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1800))

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install boto3 requests Pillow imagehash numpy pyyaml

      - name: Run pipeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET_T2: ${{ secrets.R2_BUCKET_T2 }}
          R2_PUBLIC_BASE_T2: ${{ secrets.R2_PUBLIC_BASE_T2 }}
          CHANNELS_T2_JSON: ${{ secrets.CHANNELS_T2_JSON }}
        run: python run_pipeline_t2.py
