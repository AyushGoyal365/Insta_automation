name: Reel Pipeline

on:
  schedule:
    # base cadence every 2 hours; the random sleep below jitters the actual
    # run time within each window, so real gaps land roughly 1-3h apart
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Random jitter (skip on manual trigger)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 3600))

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install boto3 requests

      - name: Run pipeline
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          CHANNELS_JSON: ${{ secrets.CHANNELS_JSON }}
        run: python run_pipeline.py
